name: PR validation

on:
  pull_request:
    branches: [main, 'release/**']
    paths: ['force-app/**', 'scripts/**', '.github/workflows/**', 'package.json']

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Pipeline script tests
        run: npm run test:scripts
      - name: Formatting
        run: npm run lint:format
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salesforce Code Analyzer (PMD rules for Apex)
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer
          sf code-analyzer run --workspace force-app --rule-selector pmd:Recommended --severity-threshold 2 --output-file analyzer.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analyzer-report
          path: analyzer.html

  validate-against-uat:
    # Check-only deploy of the delta to the UAT org, running only the relevant tests.
    needs: static-checks
    if: ${{ vars.SF_UAT_USERNAME != '' }}
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Salesforce CLI + sfdx-git-delta
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-git-delta
      - name: Authenticate (JWT – no passwords stored)
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" | base64 --decode > server.key
          sf org login jwt --username "${{ vars.SF_UAT_USERNAME }}" --jwt-key-file server.key \
            --client-id "${{ secrets.SF_JWT_CLIENT_ID }}" --instance-url "${{ vars.SF_UAT_INSTANCE_URL }}" --alias uat
          rm server.key
      - name: Build delta package
        run: sf sgd source delta --from "origin/${{ github.base_ref }}" --to HEAD --output-dir delta --generate-delta
      - name: Select Apex tests
        id: tests
        run: |
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD > changed.txt
          RESULT=$(node scripts/select-tests.js --classes force-app/main/default/classes < changed.txt)
          echo "$RESULT"
          echo "level=$(echo "$RESULT" | jq -r .testLevel)" >> "$GITHUB_OUTPUT"
          echo "tests=$(echo "$RESULT" | jq -r '.tests | join(" ")')" >> "$GITHUB_OUTPUT"
      - name: Validate (check-only) deploy
        run: |
          ARGS="--manifest delta/package/package.xml --target-org uat --wait 60 --json"
          if [ "${{ steps.tests.outputs.level }}" = "RunSpecifiedTests" ]; then
            ARGS="$ARGS --test-level RunSpecifiedTests"
            for t in ${{ steps.tests.outputs.tests }}; do ARGS="$ARGS --tests $t"; done
          elif [ "${{ steps.tests.outputs.level }}" = "RunLocalTests" ]; then
            ARGS="$ARGS --test-level RunLocalTests"
          fi
          sf project deploy validate $ARGS | tee validate.json
          echo "VALIDATION_ID=$(jq -r .result.id validate.json)" >> "$GITHUB_ENV"
      - name: Record validation id for quick deploy
        run: echo "Validation ${VALIDATION_ID} can be quick-deployed within 10 days."
